name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: raising_talents
          POSTGRES_PASSWORD: raising_talents
          POSTGRES_DB: raising_talents
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U raising_talents"
          --health-interval 5s
          --health-retries 10
      typesense:
        # Settings come from the environment, since service containers take no arguments.
        image: typesense/typesense:28.0
        env:
          TYPESENSE_API_KEY: ci-typesense-key
          TYPESENSE_DATA_DIR: /tmp
        ports: ['8108:8108']
    env:
      DATABASE_URL: postgres://raising_talents:raising_talents@localhost:5432/raising_talents
      # The search adapter's tests run against this real Typesense.
      TYPESENSE_URL: http://localhost:8108
      TYPESENSE_API_KEY: ci-typesense-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Writing standards
        run: pnpm check:writing

      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      - name: Wait for Typesense
        run: for i in $(seq 1 30); do curl -sf http://localhost:8108/health && exit 0; sleep 2; done; exit 1

      - name: Lint, typecheck, build
        run: pnpm turbo run lint typecheck build

      # On their own, so screen tests do not compete with builds for the runner's two cores.
      - name: Test
        run: pnpm turbo run test

      - name: OpenAPI document is up to date
        run: |
          if [ -n "$(git status --porcelain packages/contracts/openapi.json)" ]; then
            echo "openapi.json is out of date. Run pnpm --filter @rt/contracts build and commit the result."
            git diff --stat packages/contracts/openapi.json
            exit 1
          fi

      - name: Mobile app bundles for iOS and Android
        working-directory: apps/mobile
        run: pnpm bundle:check

      - name: Schema matches committed migrations
        working-directory: apps/api
        run: |
          pnpm db:check
          pnpm exec drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "Schema changes are not in a committed migration. Run pnpm db:generate and commit the result."
            git status --porcelain drizzle
            exit 1
          fi

      - name: Migrations apply to a clean database
        working-directory: apps/api
        run: pnpm db:migrate

  security:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Known vulnerabilities (high and critical)
        run: pnpm audit --audit-level high --prod

      - name: Secrets in history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
