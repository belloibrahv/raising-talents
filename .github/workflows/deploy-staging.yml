name: Deploy staging

# Runs after CI passes on main. Manual runs redeploy a chosen commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: staging
      url: https://api.staging.raisingtalents.app
    env:
      AWS_REGION: ${{ vars.STAGING_AWS_REGION }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: AWS credentials (short-lived, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.STAGING_AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push the API image (ARM64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: APP_VERSION=${{ env.SHA }}
          tags: ${{ vars.STAGING_ECR_REPOSITORY_URL }}:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image for known vulnerabilities
        # Pinned to a commit: this action's tags were reissued in March 2026, so a tag alone is not trusted.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ vars.STAGING_ECR_REPOSITORY_URL }}:${{ env.SHA }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Migrate, roll out and smoke test
        env:
          IMAGE: ${{ vars.STAGING_ECR_REPOSITORY_URL }}:${{ env.SHA }}
          CLUSTER: rt-staging
          API_SERVICE: rt-staging-api
          API_FAMILY: rt-staging-api
          WORKER_SERVICE: rt-staging-worker
          WORKER_FAMILY: rt-staging-worker
          MIGRATE_FAMILY: rt-staging-migrate
          MIGRATE_SUBNETS: ${{ vars.STAGING_PRIVATE_SUBNETS }}
          MIGRATE_SECURITY_GROUP: ${{ vars.STAGING_MIGRATE_SECURITY_GROUP }}
          MIGRATE_LOG_GROUP: /ecs/rt-staging-migrate
          API_URL: https://api.staging.raisingtalents.app
          GITHUB_SHA: ${{ env.SHA }}
        run: scripts/deploy-ecs.sh

  web:
    # After the API, so a new page never goes live before the API it calls.
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The deploy role trusts only jobs in the staging environment.
    environment:
      name: staging
      url: https://app.staging.raisingtalents.app
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      BUCKET: ${{ vars.STAGING_WEB_BUCKET }}
      DISTRIBUTION: ${{ vars.STAGING_WEB_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the web app
        env:
          VITE_API_URL: https://api.staging.raisingtalents.app
        run: pnpm turbo run build --filter=@rt/web

      - name: AWS credentials (short-lived, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.STAGING_AWS_REGION }}

      - name: Publish
        working-directory: apps/web/dist
        run: |
          # Source maps stay out of the public bucket.
          # Hashed files first, cached for a year. Old ones stay, so pages loaded before
          # this release can still fetch their chunks.
          aws s3 sync assets "s3://$BUCKET/assets" --exclude "*.map" \
            --cache-control "public, max-age=31536000, immutable"
          # Everything else last and never cached without asking, so no page ever points
          # at a file that is not there yet.
          aws s3 sync . "s3://$BUCKET" --exclude "assets/*" --exclude "*.map" \
            --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" \
            --paths /index.html /sw.js /manifest.webmanifest "/workbox-*.js"

      - name: Smoke test
        run: |
          url=https://app.staging.raisingtalents.app
          curl -fsS "$url/" | grep -q '<div id="root">'
          curl -fsS "$url/sign-in" | grep -q '<div id="root">'
          curl -fsS -o /dev/null "$url/manifest.webmanifest"
          curl -fsS -o /dev/null "$url/sw.js"
          # A missing file must be a 404, not the app page.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$url/assets/missing.js")" = "404"
