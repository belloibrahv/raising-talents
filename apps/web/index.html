<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Raising Talents</title>
    <meta
      name="description"
      content="Show your best work to the agents and scouts who find athletes, musicians, models, actors and creators."
    />
    <!-- The phone's status bar takes the colour of the header under it, light or dark. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0d17" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The standard name, and Apple's older one for iPhones that still read it. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Raising Talents" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Link previews. A shared talent page gets its own, written by the web server (ADR-043). -->
    <meta property="og:site_name" content="Raising Talents" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Raising Talents" />
    <meta
      property="og:description"
      content="Show your work and get discovered. A home for athletes, musicians, models, actors, dancers and creators, and the agents and scouts looking for them."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <noscript
      >Raising Talents needs JavaScript. Turn it on in your browser settings, then reload.</noscript
    >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
