<!doctype html>
<!-- The picture beside a shared link (ADR-043), 1200 by 630. generate-icons.mjs screenshots
     it in a headless Chrome, so the brand's own fonts are used, never a fallback. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Archivo Narrow';
        font-weight: 700;
        src: url('../node_modules/@fontsource/archivo-narrow/files/archivo-narrow-latin-700-normal.woff2');
      }
      @font-face {
        font-family: 'Instrument Serif';
        font-style: italic;
        src: url('../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2');
      }
      @font-face {
        font-family: 'Archivo';
        font-weight: 400;
        src: url('../node_modules/@fontsource/archivo/files/archivo-latin-400-normal.woff2');
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background:
          radial-gradient(
            ellipse 55% 75% at 78% 30%,
            rgb(255 182 39 / 0.34),
            rgb(255 182 39 / 0.08) 55%,
            transparent 75%
          ),
          #16130f;
        color: #f7f2ea;
        font-family: 'Archivo', sans-serif;
        box-sizing: border-box;
        padding: 72px 88px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 20px;
        font: 700 44px/1 'Archivo Narrow';
        letter-spacing: -0.01em;
      }
      .lockup svg {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 0;
        font: 700 112px/0.92 'Archivo Narrow';
        letter-spacing: -0.01em;
        text-transform: uppercase;
      }
      h1 em {
        font: italic 400 112px/0.92 'Instrument Serif';
        letter-spacing: 0;
        text-transform: none;
        color: #ffb627;
      }
      p {
        margin: 0;
        font-size: 30px;
        color: #c9bfb0;
      }
    </style>
  </head>
  <body>
    <div class="lockup">
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="127" fill="#FFB627" />
        <circle cx="256" cy="169" r="59" fill="#16130F" />
        <path
          d="M128 236 256 388 384 236"
          fill="none"
          stroke="#16130F"
          stroke-width="48"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="418" cy="93" r="20.5" fill="#E8492B" />
      </svg>
      Raising Talents
    </div>
    <h1>Your talent<br />deserves <em>a stage.</em></h1>
    <p>Post your work. Get seen by verified agents and scouts.</p>
  </body>
</html>
