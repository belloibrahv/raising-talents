# Local development services. Versions match staging and production.
name: raising-talents

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raising_talents
      POSTGRES_PASSWORD: raising_talents
      POSTGRES_DB: raising_talents
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U raising_talents']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  typesense:
    # Used from milestone 3 (discovery). Started now so every machine has the same setup.
    image: typesense/typesense:28.0
    command: --data-dir /data --api-key=local-dev-typesense-key --enable-cors
    ports:
      - '8108:8108'
    volumes:
      - typesense-data:/data

  mailpit:
    # Catches every email the worker sends. Open http://localhost:8025 to read them.
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  typesense-data:
