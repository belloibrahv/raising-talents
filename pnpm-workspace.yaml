packages:
  - 'apps/*'
  - 'packages/*'

auditConfig:
  ignoreGhsas:
    # node-forge reaches us only through @expo/cli, the build and dev server tool.
    # It is not bundled into the app or used by the API. No patched version exists yet.
    # Review by 2026-11-02 or when Expo ships a fix, whichever comes first.
    - GHSA-86w9-cpqp-85rv
    # braces also reaches us only through @expo/cli (its Metro file map), build tooling for the
    # parked native app. No patched version exists yet. Review by 2026-11-03.
    - GHSA-vfj7-8cjw-p6xm
    # zod 3 reaches us only through @expo/cli, which pins it; the API, the web app and the
    # contracts use the patched zod 4.6.7. No zod 3 release has the fix. Review by 2026-11-07.
    - GHSA-mrhx-c7xc-m3w5

packageExtensions:
  # Its multipart interceptor imports rxjs without declaring it, so it worked only while pnpm
  # happened to hoist rxjs 7. Declaring the peer pins it to the one the API uses.
  '@nestjs/platform-fastify':
    peerDependencies:
      rxjs: ^7.1.0
